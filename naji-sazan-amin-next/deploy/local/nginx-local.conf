# Local HTTP deployment for testing the Next.js export in out/.
# Same routing, caching and security headers as deploy/nginx.conf,
# minus TLS (plain HTTP on localhost; the browser would only show a
# self-signed-certificate warning).

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    access_log /var/log/nginx/naji-sazan-amin.access.log;
    error_log  /var/log/nginx/naji-sazan-amin.error.log warn;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # Serve the precompressed .br/.gz files written by scripts/postbuild.mjs
    # for text assets; on-the-fly gzip above only handles anything left over.
    brotli_static on;
    gzip_static on;

    # Canonicalise legacy .html URLs. The static export uses trailing slashes.
    # The internal redirect from `index index.html` keeps $request_uri at the
    # original path, so only an external /index.html request is redirected.
    location = /index.html {
        if ($request_uri = /index.html) {
            return 301 /;
        }
        try_files /index.html =404;
    }

    location ~ ^/(about|projects|contact)\.html$ {
        return 301 /$1/;
    }

    # Internal error document; external requests fall through the 404 handler.
    location = /404.html {
        internal;
        expires -1;
    }

    # Fingerprinted Next.js assets: one year, immutable.
    # add_header does not inherit from the server block when a location sets it,
    # so the security headers are repeated here.
    location /_next/static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Content-hashed images, fonts and video (postbuild fingerprinting): one
    # year, immutable. add_header does not inherit from the server block when a
    # location sets it, so the security headers are repeated here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Never serve editor, git or environment files.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Static pages and directory indexes. HTML is revalidated so rebuilds are
    # visible immediately; fingerprinted assets are cached by the locations above.
    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
